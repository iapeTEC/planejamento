# Deploy TEMPORÁRIO na VPS siyum, enquanto o túnel de acesso à VM iape não
# volta (ver migration/NEXT_STEPS.md). Quando a VM estiver acessível de novo,
# isso migra pra lá seguindo o mesmo padrão relay+Caddy dos outros apps
# (projeto/onevoice27/homework) — o bloco planejamento.iape.tech no Caddyfile
# já está pronto para isso, só trocar o alvo do reverse_proxy de volta pro
# relay (172.19.0.1:23043) em vez do container `web` direto.
name: planejamento

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: planejamento
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: planejamento
    volumes:
      - planejamento_db_data:/var/lib/postgresql/data
    networks:
      - internal

  api:
    build: ../api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://planejamento:${POSTGRES_PASSWORD}@db:5432/planejamento?schema=public
      PORT: 3300
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      AI_MODEL: ${AI_MODEL:-codex-luna-medium}
      AI_ENDPOINT: ${AI_ENDPOINT:-}
    depends_on:
      - db
    networks:
      - internal

  web:
    build: ../web
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - internal
      - siyum_edge

networks:
  internal:
    name: planejamento_internal
  siyum_edge:
    external: true

volumes:
  planejamento_db_data:
