# Deploy definitivo na VM escolar (iape/srv-school). Rede e volume próprios,
# não reaproveita nada dos outros projetos que já rodam aqui
# (projeto-app:3000, homework-app:3200, onevoice27-web:3127). O `web` publica
# só em loopback (127.0.0.1:3300) — a exposição pública é feita pelo túnel
# reverso (planejamento-http-tunnel.service) até o relay na VPS, que o Caddy
# de lá usa pra servir planejamento.iape.tech. Mesmo padrão de
# projeto/onevoice27/homework.
name: planejamento

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: planejamento
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: planejamento
    volumes:
      - planejamento_db_data:/var/lib/postgresql/data
    networks:
      - internal

  api:
    build: ../api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://planejamento:${POSTGRES_PASSWORD}@db:5432/planejamento?schema=public
      PORT: 3300
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      AI_MODEL: ${AI_MODEL:-codex-luna-medium}
      AI_ENDPOINT: ${AI_ENDPOINT:-}
    depends_on:
      - db
    networks:
      - internal

  web:
    build: ../web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:3300:80"
    networks:
      - internal

networks:
  internal:
    name: planejamento_internal

volumes:
  planejamento_db_data:
